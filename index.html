<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商设计生图工作流</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f0e8; --surface: #faf5ed; --surface2: #f3ebde;
  --border: rgba(44,44,44,0.1); --text: #2c2c2c; --text2: rgba(44,44,44,0.55);
  --primary: #0ea5e9; --primary-hover: #0284c7;
  --success: #10b981; --warning: #f59e0b; --danger: #c53030;
  --radius: 4px; --shadow: 2px 2px 0 rgba(44,44,44,0.08);
}
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: radial-gradient(circle at top left, rgba(255,255,255,0.72), transparent 38%), linear-gradient(180deg, #fbf5eb, #f3ebde); color: var(--text); min-height: 100vh; }
.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; overflow-y: auto; }
.sidebar h1 { font-size: 16px; padding: 0 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; font-weight: 700; }
.sidebar h1 span { color: var(--primary); }
.nav-group { padding: 8px 12px; }
.nav-group-title { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; padding: 8px; margin-bottom: 4px; }
.nav-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; transition: all .2s; display: flex; align-items: center; gap: 8px; color: var(--text2); }
.nav-item:hover { background: rgba(44,44,44,0.05); color: var(--text); }
.nav-item.active { background: rgba(44,44,44,0.08); color: var(--text); box-shadow: 2px 2px 0 rgba(44,44,44,0.06); }
.nav-item .icon { width: 20px; text-align: center; }
.main { display: flex; flex-direction: column; overflow: hidden; background: transparent; }
.header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.header h2 { font-size: 20px; font-weight: 700; }
.header .badge { background: var(--surface2); padding: 4px 10px; border-radius: var(--radius); font-size: 11px; color: var(--text2); border: 1px solid var(--border); }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.steps { display: flex; gap: 8px; margin-bottom: 24px; }
.step-tab { padding: 8px 16px; border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 13px; border: 1px solid var(--border); transition: all .2s; }
.step-tab.active { background: var(--text); border-color: var(--text); color: var(--surface); box-shadow: 2px 2px 0 rgba(44,44,44,0.15); }
.step-tab.done { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--success); }
.card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden; }
.card::before { content: none; }
.card h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); font-weight: 600; }
.card p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 8px; }
textarea, input, select { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; color: var(--text); font-size: 13px; resize: vertical; font-family: inherit; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(14,165,233,0.1); }
textarea { min-height: 120px; }
.btn { padding: 10px 20px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
.btn-primary { background: var(--text); color: var(--surface); }
.btn-primary:hover { background: #1a1814; box-shadow: 2px 2px 0 rgba(44,44,44,0.15); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: rgba(44,44,44,0.06); }
.btn-success { background: var(--success); color: #fff; }
.btn-copy { background: transparent; color: var(--text2); border: 1px solid var(--border); padding: 6px 12px; font-size: 12px; border-radius: var(--radius); }
.btn-copy:hover { border-color: var(--text); color: var(--text); }
.btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.upload-zone { border: 1.5px dashed rgba(44,44,44,0.2); border-radius: var(--radius); padding: 40px; text-align: center; cursor: pointer; transition: all .2s; background: #fff; }
.upload-zone:hover { border-color: var(--primary); background: rgba(14,165,233,0.03); }
.upload-zone img { max-width: 200px; max-height: 200px; border-radius: var(--radius); margin-top: 12px; }
.prompt-box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 12px 0; font-size: 12px; line-height: 1.8; white-space: pre-wrap; max-height: 400px; overflow-y: auto; position: relative; }
.loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(44,44,44,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 4px 8px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(44,44,44,0.3); z-index: 99; backdrop-filter: blur(2px); pointer-events: none; }
.overlay.show { display: block; pointer-events: auto; }
.img-thumb { position: relative; display: inline-block; }
.img-thumb img { max-width: 120px; max-height: 120px; border-radius: var(--radius); border: 1px solid var(--border); }
.img-thumb .del-btn { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
.img-thumb .del-btn:hover { transform: scale(1.2); }
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -300px; top: 0; bottom: 0; width: 280px; z-index: 100; transition: left .3s ease; }
  .sidebar.open { left: 0; }
  .menu-toggle { display: block; }
  .header { padding: 12px 16px; }
  .content { padding: 16px; }
  .steps { flex-wrap: wrap; }
  .form-row { grid-template-columns: 1fr; }
  .upload-zone { padding: 24px; }
}
</style>
</head>

function getPromptFor(wf, step) {
  if (wf === 'visual-compose') {
    if (step === 0) return '请分析这张图片，生成一段能指导AI生图工具创作类似的作品的文生图提示词，需包含关键元素、场景、构图、色彩色调、画面风格、背景要素。';
    return '';
  }
  if (step === 0) {
    if (wf === 'fashion-detail') return PROMPTS.fashionDetailRecognition;
    if (wf === 'fashion-model') return PROMPTS.fashionModelRecognition;
    if (wf === 'fashion-product') return PROMPTS.fashionProductRecognition;
    if (wf === 'product-photo') return PROMPTS.productPhotoRecognition;
    if (['amazon-aplus-module','amazon-aplus-oneshot'].includes(wf)) return PROMPTS.amazonAplusRecognition;
    if (wf === 'style-high') return PROMPTS.styleReverse;
    if (wf === 'style-low') return PROMPTS.styleLowRecognition;
    if (['cross-main','cross-poster','cross-detail','cross-style'].includes(wf)) return PROMPTS.crossRecognition;
    return PROMPTS.recognition;
  }
  if (step === 1) {
    if (wf === 'main-image') return PROMPTS.mainImageGen;
    if (wf === 'cross-main') return PROMPTS.crossMainImageGen;
    if (wf === 'detail-page') return PROMPTS.detailPageGen;
    if (wf === 'cross-detail') return PROMPTS.crossDetailPageGen;
    if (wf === 'cross-style') return PROMPTS.crossStyleGen;
    if (wf === 'style-low') return PROMPTS.styleLowReverse;
    if (wf === 'poster') return PROMPTS.posterGen;
    if (wf === 'cross-poster') return PROMPTS.crossPosterGen;
    if (wf === 'amazon-aplus-module') return PROMPTS.amazonAplusModuleGen;
    if (wf === 'product-photo') return PROMPTS.productPhotoGen;
    if (wf === 'fashion-product') return PROMPTS.fashionProductGen;
    if (wf === 'fashion-model') return PROMPTS.fashionModelGenNew;
    if (wf === 'fashion-detail') return PROMPTS.fashionDetailGen;
    return PROMPTS.mainImageGen;
  }
  return '';
}

function renderMain() {
  const wf = state.currentWorkflow;
  if (wf === 'settings') { renderSettings(); return; }
  if (wf === 'home') { renderHome(); return; }
  const w = WORKFLOWS[wf];
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="header"><button class="menu-toggle" onclick="toggleDrawer()">☰</button><h2>${w.name}</h2><span class="badge">${w.ratio} ${w.count?'· '+w.count+'张':''}</span></div>
    <div class="content">
      <p style="color:var(--text2);margin-bottom:16px;font-size:13px">${w.desc}</p>
      <div class="steps">${w.steps.map((s,i)=>`<div class="step-tab ${i===state.currentStep?'active':''} ${i<state.currentStep?'done':''}" onclick="setStep(${i})">${i+1}. ${s}</div>`).join('')}</div>
      <div id="stepContent"></div>
    </div>`;
  renderStep();
}

function setStep(i) { state.currentStep = i; renderMain(); }

function renderStep() {
  const wf = state.currentWorkflow;
  const step = state.currentStep;
  const el = document.getElementById('stepContent');
  if (!el) return;
  if (wf === 'white-bg' && step === 0) { renderWhiteBg(el); return; }
  if (wf === 'visual-compose') { renderVisualCompose(el, step); return; }
  if (wf === 'amazon-aplus-oneshot' && step === 1) { renderAplusOneshot(el); return; }
  if (wf === 'style-high') { renderStyleHigh(el); return; }
  if (step === 0) renderRecognition(el);
  else if (step === 1) renderPromptGen(el);
  else renderImageGen(el);
}

async function styleHighImage2Gen() {
  const c = getConfig();
  if (!c.imgKey || !c.imgUrl) { alert('请先在API设置中配置图片生成API'); return; }
  if (state.uploadedImages.length === 0) { alert('请上传参考图'); return; }
  if (state.productImages.length === 0) { alert('请上传产品图'); return; }
  const prompt = '复刻图1的设计，为图2生成电商图，分屏生成，1屏1图';
  const images = [...state.uploadedImages, ...state.productImages];
  const resultArea = document.getElementById('styleHighResult');
  resultArea.innerHTML = '<p><span class="loading"></span> 正在生成...</p>';
  const baseUrl = c.imgUrl.replace(/\/+$/, '');
  const endpoint = baseUrl.includes('/images') ? baseUrl : baseUrl + '/images/generations';
  try {
    let resp;
    if (endpoint.includes('/images/edits')) {
      const fd = new FormData();
      fd.append('model', c.imgModel);
      fd.append('prompt', prompt);
      fd.append('size', '768x1024');
      for (let i = 0; i < images.length; i++) {
        const blob = await (await fetch(images[i])).blob();
        fd.append('image', blob, `image${i}.png`);
      }
      resp = await fetch(endpoint, { method:'POST', headers:{'Authorization':'Bearer '+c.imgKey}, body:fd });
    } else {
      const body = { model: c.imgModel, prompt, size: '768x1024', image: images };
      resp = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.imgKey}, body:JSON.stringify(body) });
    }
    const data = await resp.json();
    if (data.data && data.data[0]) {
      const url = data.data[0].url || (data.data[0].b64_json ? 'data:image/png;base64,'+data.data[0].b64_json : null);
      if (url) { resultArea.innerHTML = renderImageResult(url, '风格复刻结果'); return; }
    }
    resultArea.innerHTML = `<p style="color:var(--danger)">生成失败: ${JSON.stringify(data.error||data).slice(0,300)}</p>`;
  } catch(e) { resultArea.innerHTML = `<p style="color:var(--danger)">请求失败: ${e.message}</p>`; }
}

async function generateFusion() {
  const c = getConfig();
  const model = document.getElementById('vcFusionModel')?.value || c.imgModel;
  if (!model) { alert('请输入模型名'); return; }
  const prompt = document.getElementById('fusionPrompt').value;
  if (!prompt.trim()) { alert('请输入融图提示词'); return; }
  if (!state.sceneImageUrl && state.uploadedImages.length === 0) { alert('请先在第二步生成场景图'); return; }
  if (state.productImages.length === 0) { alert('请上传产品图'); return; }
  const resolution = document.getElementById('vcFusionRes').value;
  const [w, h] = resolution.split('x').map(Number);
  const resultArea = document.getElementById('fusionResult');
  resultArea.innerHTML = '<p><span class="loading"></span> 正在融合生成...</p>';

  const images = [];
  if (state.sceneImageUrl) images.push(state.sceneImageUrl);
  images.push(...state.productImages);

  const baseUrl = c.imgUrl.replace(/\/+$/, '');
  const endpoint = baseUrl.includes('/images') ? baseUrl : baseUrl + '/images/generations';
  try {
    const body = { model, prompt, size: `${w}x${h}`, image: images };
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${c.imgKey}` },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (data.data && data.data[0]) {
      const url = data.data[0].url || (data.data[0].b64_json ? 'data:image/png;base64,' + data.data[0].b64_json : null);
      if (url) { resultArea.innerHTML = renderImageResult(url, '融合打光结果'); return; }
    }
    if (data.error) {
      const errMsg = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
      resultArea.innerHTML = `<p style="color:var(--danger)">生成失败: ${errMsg}</p>`;
    } else {
      resultArea.innerHTML = `<p style="color:var(--danger)">未知返回: ${JSON.stringify(data).slice(0,300)}</p>`;
    }
  } catch(err) {
    resultArea.innerHTML = `<p style="color:var(--danger)">请求失败: ${err.message}</p>`;
  }
}

function parsePrompts(text) {
  if (!text || text.trim().length === 0) return [];
  const results = [];

  const headerPattern = /(?:^|\n)#{1,3}\s*第([一二三四五六七八九十\d]+)[张屏幕图页]?[：:\s]*([^\n]*)/g;
  const headers = [];
  let match;
  while ((match = headerPattern.exec(text)) !== null) {
    const numStr = match[1];
    const num = '一二三四五六七八九十'.indexOf(numStr) + 1 || parseInt(numStr) || headers.length + 1;
    headers.push({ num, title: match[2].trim(), start: match.index, headerEnd: match.index + match[0].length });
  }

  if (headers.length >= 2) {
    for (let i = 0; i < headers.length; i++) {
      const contentStart = headers[i].headerEnd;
      const contentEnd = i < headers.length - 1 ? headers[i+1].start : text.length;
      const content = text.slice(contentStart, contentEnd).trim();
      if (content.length > 10) {
        results.push({ title: headers[i].title || `图片${headers[i].num}`, content, index: headers[i].num });
      }
    }
    return results;
  }

  const altPattern = /(?:^|\n)(?:第([一二三四五六七八九十\d]+)[张屏幕图页]|(?:场景|主图|海报|详情)\s*(\d+))[：:\s]*([^\n]*)/g;
  const altHeaders = [];
  while ((match = altPattern.exec(text)) !== null) {
    const numStr = match[1] || match[2];
    const num = '一二三四五六七八九十'.indexOf(numStr) + 1 || parseInt(numStr) || altHeaders.length + 1;
    altHeaders.push({ num, title: (match[3]||'').trim(), start: match.index, headerEnd: match.index + match[0].length });
  }

  if (altHeaders.length >= 2) {
    for (let i = 0; i < altHeaders.length; i++) {
      const contentStart = altHeaders[i].headerEnd;
      const contentEnd = i < altHeaders.length - 1 ? altHeaders[i+1].start : text.length;
      const content = text.slice(contentStart, contentEnd).trim();
      if (content.length > 10) {
        results.push({ title: altHeaders[i].title || `图片${altHeaders[i].num}`, content, index: altHeaders[i].num });
      }
    }
    return results;
  }

  const numPattern = /(?:^|\n)(\d+)[\.、）\)]\s*([^\n]*)/g;
  const numHeaders = [];
  while ((match = numPattern.exec(text)) !== null) {
    numHeaders.push({ num: parseInt(match[1]), title: match[2].trim(), start: match.index, headerEnd: match.index + match[0].length });
  }
  if (numHeaders.length >= 2) {
    for (let i = 0; i < numHeaders.length; i++) {
      const contentStart = numHeaders[i].headerEnd;
      const contentEnd = i < numHeaders.length - 1 ? numHeaders[i+1].start : text.length;
      const content = text.slice(contentStart, contentEnd).trim();
      if (content.length > 20) {
        results.push({ title: numHeaders[i].title || `图片${numHeaders[i].num}`, content, index: numHeaders[i].num });
      }
    }
    return results;
  }

  const sections = text.split(/\n---+\n|\n{3,}/).filter(s => s.trim().length > 30);
  if (sections.length >= 2) {
    return sections.map((s, i) => {
      const firstLine = s.trim().split('\n')[0].replace(/^[#*\s]+/, '').slice(0, 30);
      return { title: firstLine || `图片${i+1}`, content: s.trim(), index: i+1 };
    });
  }

  if (text.trim().length > 20) {
    return [{ title: '完整提示词', content: text.trim(), index: 1 }];
  }
  return [];
}

  if (!c.imgModel) { alert('请先在设置中选择图片生成模型'); return; }

  const prompts = parsePrompts(state.generatedPrompts);
  const resolution = document.getElementById('imgResolution').value;
  const [w, h] = resolution.split('x').map(Number);
  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = `<p style="color:var(--text2)"><span class="loading"></span> 正在生成 ${checked.length} 张图片（每张间隔3秒避免限流）...</p>`;

  state.lastBatchResults = [];
  const delay = parseInt(document.getElementById('imgDelay')?.value || '10') * 1000;
  for (let i = 0; i < checked.length; i++) {
    const cb = checked[i];
    const idx = parseInt(cb.dataset.index);
    const prompt = prompts[idx];
    if (!prompt) continue;
    resultArea.innerHTML = `<p style="color:var(--text2)"><span class="loading"></span> 正在生成第${idx+1}张 (${i+1}/${checked.length}): ${prompt.title}...</p>` + renderBatchResults(state.lastBatchResults);

    const res = await generateWithRetry(prompt.content, w, h, c, 3);
    state.lastBatchResults.push({ index: idx+1, title: prompt.title, prompt: prompt.content, ...res });

    if (i < checked.length - 1) await sleep(delay);
  }
  resultArea.innerHTML = renderBatchResults(state.lastBatchResults);
}

async function generateWithRetry(prompt, w, h, c, maxRetries) {
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    const res = await generateSingleImage(prompt, w, h, c);
    if (res.url) return res;
    const err = (res.error || '').toLowerCase();
    const isRetryable = err.includes('high load') || err.includes('rate') || err.includes('limit') || err.includes('429') || err.includes('繁忙') || err.includes('稍后') || err.includes('retry') || err.includes('overload') || err.includes('timeout') || err.includes('503') || err.includes('502');
    if (isRetryable && attempt < maxRetries) {
      await sleep(10000 * attempt);
      continue;
    }
    return res;
  }
  return { error: '重试多次仍失败，建议稍后再试或换一个模型' };
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function renderBatchResults(results) {
  if (!results || results.length === 0) return '';
  const successCount = results.filter(r => r.url).length;
  const failCount = results.filter(r => !r.url).length;
  let html = `<p style="font-size:12px;color:var(--text2);margin-bottom:12px">完成 ${results.length} 张：成功 ${successCount}，失败 ${failCount}${failCount > 0 ? ' <button class="btn btn-copy" onclick="retryFailed()" style="margin-left:8px">重试失败项</button>' : ''}</p>`;
  html += '<div class="result-grid">' + results.map(r => {
    if (r.url) return `<div style="text-align:center">
      <img src="${r.url}" referrerpolicy="no-referrer" crossorigin="anonymous" style="width:100%;border-radius:8px;border:1px solid var(--border)" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div style="display:none;padding:8px;background:var(--surface2);border-radius:8px"><a href="${r.url}" target="_blank" style="color:var(--primary);font-size:11px;word-break:break-all">点击查看图片</a></div>
      <p style="font-size:11px;color:var(--text2);margin-top:4px">第${r.index}张: ${r.title}</p>
      <a href="${r.url}" target="_blank" class="btn btn-copy" style="margin-top:4px;text-decoration:none;display:inline-block;font-size:10px">打开</a></div>`;
    return `<div class="card" style="padding:12px"><p style="color:var(--danger);font-size:11px">第${r.index}张: ${r.title}</p><p style="color:var(--text2);font-size:11px;margin-top:4px">${r.error}</p></div>`;
  }).join('') + '</div>';
  return html;
}

async function retryFailed() {
  const c = getConfig();
  const resolution = document.getElementById('imgResolution')?.value || '2048x2048';
  const [w, h] = resolution.split('x').map(Number);
  const resultArea = document.getElementById('resultArea');
  const failed = state.lastBatchResults.filter(r => !r.url);
  resultArea.innerHTML = `<p><span class="loading"></span> 正在重试 ${failed.length} 张失败图片...</p>` + renderBatchResults(state.lastBatchResults.filter(r => r.url));

  for (let i = 0; i < failed.length; i++) {
    const item = failed[i];
    const res = await generateWithRetry(item.prompt, w, h, c, 3);
    const idx = state.lastBatchResults.findIndex(r => r.index === item.index);
    if (idx !== -1) state.lastBatchResults[idx] = { ...item, ...res };
    if (i < failed.length - 1) await sleep(5000);
  }
  resultArea.innerHTML = renderBatchResults(state.lastBatchResults);
}

async function generateSingleImage(prompt, w, h, c) {
  const baseUrl = c.imgUrl.replace(/\/+$/, '');
  const endpoint = baseUrl.includes('/images') ? baseUrl : baseUrl + '/images/generations';

  try {
    const images = state.productImages.length > 0 ? state.productImages : state.uploadedImages;
    let resp;
    if (endpoint.includes('/images/edits')) {
      const fd = new FormData();
      fd.append('model', c.imgModel);
      fd.append('prompt', prompt);
      fd.append('size', `${w}x${h}`);
      for (let i = 0; i < images.length; i++) {
        const blob = await (await fetch(images[i])).blob();
        fd.append('image', blob, `image${i}.png`);
      }
      resp = await fetch(endpoint, { method:'POST', headers:{'Authorization':`Bearer ${c.imgKey}`}, body:fd });
    } else {
      const body = { model: c.imgModel, prompt, size: `${w}x${h}` };
      if (images.length > 0) body.image = images.map(img => img);
      resp = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${c.imgKey}`}, body:JSON.stringify(body) });
    }
    const data = await resp.json();
    if (data.data && data.data[0]) {
      const imgData = data.data[0];
      const url = imgData.url || (imgData.b64_json ? 'data:image/png;base64,' + imgData.b64_json : null);
      if (url) return { url };
    }
    if (data.error) {
      const errMsg = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
      return { error: errMsg };
    }
    return { error: '未知返回: ' + JSON.stringify(data).slice(0, 300) };
  } catch (err) {
    return { error: err.message };
  }
}

function buildImageRequestBody(prompt, w, h, c) {
  const format = state.apiConfig.imgFormat || 'auto';
  const url = c.imgUrl.toLowerCase();
  const sendImage = state.apiConfig.sendRefImage === true;
  const refImage = (sendImage && state.uploadedImages.length > 0) ? state.uploadedImages[0].replace(/^data:image\/\w+;base64,/, '') : null;

  if (format === 'openai' || (format === 'auto' && url.includes('openai.com'))) {
    const body = { model: c.imgModel, prompt, size: `${w}x${h}` };
    if (refImage) body.image = refImage;
    return body;
  }
  if (format === 'dashscope' || (format === 'auto' && (url.includes('dashscope') || url.includes('aliyun')))) {
    const body = { model: c.imgModel, input: { prompt }, parameters: { size: `${w}*${h}` } };
    if (refImage) body.input.ref_image = refImage;
    return body;
  }
  if (format === 'zhipu' || (format === 'auto' && (url.includes('bigmodel') || url.includes('zhipu')))) {
    const body = { model: c.imgModel, prompt, size: `${w}x${h}` };
    if (refImage) body.image = refImage;
    return body;
  }
  if (format === 'siliconflow' || (format === 'auto' && url.includes('siliconflow'))) {
    const body = { model: c.imgModel, prompt, image_size: `${w}x${h}` };
    if (refImage) body.image = refImage;
    return body;
  }
  if (format === 'replicate' || (format === 'auto' && url.includes('replicate'))) {
    const body = { model: c.imgModel, input: { prompt, width: w, height: h } };
    if (refImage) body.input.image = refImage;
    return body;
  }
  if (format === 'custom') {
    try {
      const tpl = state.apiConfig.imgBodyTemplate || '{}';
      const body = JSON.parse(tpl.replace(/\{\{prompt\}\}/g, prompt.replace(/"/g, '\\"')).replace(/\{\{width\}\}/g, w).replace(/\{\{height\}\}/g, h).replace(/\{\{model\}\}/g, c.imgModel).replace(/\{\{size\}\}/g, `${w}x${h}`).replace(/\{\{image\}\}/g, refImage || ''));
      return body;
    } catch(e) {
      const body = { model: c.imgModel, prompt, width: w, height: h };
      if (refImage) body.image = refImage;
      return body;
    }
  }
  const body = { model: c.imgModel, prompt, width: w, height: h, size: `${w}x${h}` };
  if (refImage) body.image = refImage;
  return body;
}

async function homeGenerate() {
  const c = getConfig();
  if (!c.imgKey || !c.imgUrl) { alert('请先在API设置中配置图片生成API'); return; }
  const model = c.imgModel || 'nano-banana-pro';
  const prompt = document.getElementById('homePrompt').value;
  if (!prompt.trim()) { alert('请输入提示词'); return; }
  const ratio = document.getElementById('homeRatio').value;
  let w = 1024, h = 1024;
  if (ratio !== 'auto') { [w, h] = ratio.split('x').map(Number); }
  const count = parseInt(document.getElementById('homeCount').value);
  const resultArea = document.getElementById('homeResultArea');
  resultArea.innerHTML = `<p><span class="loading"></span> 正在生成 ${count} 张图片...</p>`;

  const results = [];
  for (let i = 0; i < count; i++) {
    resultArea.innerHTML = `<p><span class="loading"></span> 正在生成第 ${i+1}/${count} 张...</p>` + renderHomeResults(results);
    const res = await generateSingleImage(prompt, w, h, {...c, imgModel: model});
    results.push(res);
    if (i < count - 1) await sleep(3000);
  }
  resultArea.innerHTML = renderHomeResults(results);
}

function renderHomeResults(results) {
  if (!results.length) return '';
  return '<div class="result-grid">' + results.map((r,i) => {
    if (r.url) return `<div style="text-align:center"><img src="${r.url}" referrerpolicy="no-referrer" crossorigin="anonymous" style="width:100%;border-radius:8px;border:1px solid var(--border)" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div style="display:none;padding:8px;background:var(--surface2);border-radius:8px"><a href="${r.url}" target="_blank" style="color:var(--primary);font-size:11px">点击查看</a></div><a href="${r.url}" target="_blank" class="btn btn-copy" style="margin-top:4px;text-decoration:none;display:inline-block;font-size:10px">打开</a></div>`;
    return `<div class="card" style="padding:8px"><p style="color:var(--danger);font-size:11px">失败: ${r.error}</p></div>`;
  }).join('') + '</div>';
}

async function fetchModels(type) {
  const urlEl = document.getElementById(type === 'text' ? 'sTextUrl' : 'sImgUrl');
  const keyEl = document.getElementById(type === 'text' ? 'sTextKey' : 'sImgKey');
  const selEl = document.getElementById(type === 'text' ? 'sTextModel' : 'sImgModel');
  const statusEl = document.getElementById(type + 'ModelStatus');
  const baseUrl = urlEl.value.replace(/\/+$/, '');
  const key = keyEl.value;

  if (!baseUrl || !key) { statusEl.textContent = '请先填写API地址和Key'; return; }
  statusEl.innerHTML = '<span class="loading"></span> 正在获取模型列表...';

  let modelsUrl = baseUrl + '/models';
  if (baseUrl.includes('/chat/completions')) modelsUrl = baseUrl.replace('/chat/completions', '/models');
  if (baseUrl.includes('/images/generations')) modelsUrl = baseUrl.replace('/images/generations', '/models');
  if (baseUrl.includes('/images/edits')) modelsUrl = baseUrl.replace('/images/edits', '/models');

  try {
    const resp = await fetch(modelsUrl, {
      headers: { 'Authorization': `Bearer ${key}`, 'x-api-key': key, 'Content-Type': 'application/json' }
    });
    const data = await resp.json();
    let models = [];

    if (data.data && Array.isArray(data.data)) {
      models = data.data.map(m => m.id || m.name || m).filter(Boolean);
    } else if (Array.isArray(data.models)) {
      models = data.models.map(m => m.id || m.name || m).filter(Boolean);
    } else if (Array.isArray(data)) {
      models = data.map(m => typeof m === 'string' ? m : (m.id || m.name)).filter(Boolean);
    } else if (data.result && Array.isArray(data.result)) {
      models = data.result.map(m => m.id || m.name || m).filter(Boolean);
    }

    if (models.length === 0) {
      statusEl.innerHTML = `<span style="color:var(--warning)">未能解析模型列表，返回数据：${JSON.stringify(data).slice(0,200)}</span>`;
      return;
    }

    models.sort();
    const inputEl = document.getElementById(type === 'text' ? 'sTextModel' : 'sImgModel');
    if (inputEl && models.length > 0) inputEl.value = models[0];
    statusEl.innerHTML = `<span style="color:var(--success)">已获取 ${models.length} 个模型，点击选择：</span><br>` + models.map(m => `<a href="#" onclick="document.getElementById('${type==='text'?'sTextModel':'sImgModel'}').value='${m}';return false" style="color:var(--primary);margin-right:8px;font-size:12px">${m}</a>`).join('');
  } catch (err) {
    const isCors = err.message === 'Failed to fetch' || err.message === 'Load failed';
    statusEl.innerHTML = isCors
      ? `<span style="color:var(--warning)">获取失败（跨域限制）：请直接在上方输入框手动填写模型名称（如 gpt-image-2），或安装浏览器CORS插件后重试</span>`
      : `<span style="color:var(--danger)">获取失败: ${err.message}</span>`;
  }
}

function handleUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(f => {
    const img = new Image();
    img.onload = () => {
      const maxSize = 1200;
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.8);
      state.uploadedImages.push(compressed);
      showPreviews();
    };
    img.src = URL.createObjectURL(f);
  });
}

  if (isCross) {
    const country = document.getElementById('initCountry')?.value || '';
    const platform = document.getElementById('initPlatform')?.value || '';
    state.initCountry = country;
    state.initPlatform = platform;
    if (!country && !platform) return '';
    return `\n\n# 初始化\n1. 目标国家/地区：${country||'[未填写]'}\n2. 目标电商平台：${platform||'[未填写]'}\n3. 上传图片：[产品实拍图/包装图]`;

    const country = document.getElementById('initCountry')?.value || '';

    const count = document.getElementById('initAplusCount')?.value || '5';

async function callTextApi(step) {
  const c = getConfig();
  if (!c.textKey) { alert('请先在设置中配置文本AI的API Key'); return; }
  if (!c.textModel) { alert('请先在设置中选择模型'); return; }
  const prompt = getPromptFor(state.currentWorkflow, step);
  const initSuffix = (step === 0) ? getInitSuffix() : '';
  const fullPrompt = prompt + initSuffix;
  const sysMsg = { role: 'system', content: '你是一名资深电商设计师助手。重要规则：你必须直接以纯文本形式回复，禁止调用任何工具(tool)或函数(function)，禁止输出JSON格式，禁止使用EnterPlanMode或任何其他工具。直接输出设计方案的文字内容即可。' };
  const userContent = step === 1
    ? '以下是产品识别报告：\n' + state.recognitionResult + '\n\n---\n\n请根据以上识别报告，' + fullPrompt + '\n\n【重要】请直接输出提示词文本，不要调用任何工具或函数。'
    : fullPrompt + '\n\n【重要】请直接输出识别报告文本，不要调用任何工具或函数。';
  const messages = [sysMsg];
  if (state.uploadedImages.length > 0 && step === 0) {
    const maxImages = Math.min(state.uploadedImages.length, 4);
    const imgs = state.uploadedImages.slice(0, maxImages);
    messages.push({
      role: 'user',
      content: [
        { type: 'text', text: userContent },
        ...imgs.map(img => ({ type: 'image_url', image_url: { url: img, detail: 'low' } }))
      ]
    });
  } else {
    messages.push({ role: 'user', content: userContent });
  }

  const statusEl = step === 0 ? document.getElementById('recognitionResult') : document.getElementById('genPrompts');
  if (statusEl) statusEl.value = '正在调用AI，请稍候...';

  const baseUrl = c.textUrl.replace(/\/+$/, '');
  const endpoint = baseUrl.includes('/chat/completions') ? baseUrl : baseUrl + '/chat/completions';

  try {
    const body = { model: c.textModel, messages, max_tokens: 8192, tool_choice: 'none' };
    let result = await doTextRequest(endpoint, c.textKey, body);

    if (result.startsWith('[模型仍在尝试调用工具')) {
      const retryMessages = [
        { role: 'system', content: 'IMPORTANT: Do NOT use any tools. Do NOT call any functions. Respond with plain text ONLY. You are a senior e-commerce designer assistant.' },
        { role: 'user', content: '请注意：直接用纯文本回复，不要使用任何工具或函数调用。\n\n' + userContent }
      ];
      const retryBody = { model: c.textModel, messages: retryMessages, max_tokens: 8192 };
      result = await doTextRequest(endpoint, c.textKey, retryBody);
    }

    if (step === 0) { state.recognitionResult = result; }
    else { state.generatedPrompts = result; }
    if (statusEl) statusEl.value = result;
  } catch (err) {
    if (statusEl) statusEl.value = '调用失败: ' + err.message;
  }
}

async function doTextRequest(endpoint, key, body) {
  const resp = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}`, 'x-api-key': key },
    body: JSON.stringify(body)
  });
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch(e) {
    if (text.startsWith('<!') || text.startsWith('<html')) {
      return `接口返回了HTML页面而非JSON（HTTP ${resp.status}）。可能原因：\n1. API地址配置错误\n2. 网络被代理/VPN/防火墙拦截\n3. API Key无效\n\n请求地址: ${endpoint}`;
    }
    return `JSON解析失败（HTTP ${resp.status}）: ${text.slice(0, 300)}`;
  }

  if (data.choices && data.choices[0]) {
    const msg = data.choices[0].message;
    if (msg.content && msg.content.length > 0) {
      return msg.content;
    } else if (msg.tool_calls && msg.tool_calls.length > 0) {
      return '[模型仍在尝试调用工具，建议在API设置中换一个模型（如 gpt-4o、claude-sonnet-4-6、deepseek-chat）]\n\n当前中转站的该模型被配置为带工具的Agent模式，无法直接输出文本。\n\n解决方案：\n1. 在API设置中切换到其他模型\n2. 或手动复制上方的提示词到其他AI对话中生成';
    } else {
      return '[模型返回空内容，请重试]';
    }
  } else if (data.content && Array.isArray(data.content)) {
    return data.content.map(b => b.text || '').join('\n');
  } else if (data.error) {
    return '接口错误: ' + (data.error.message || JSON.stringify(data.error));
  }
  return '未知返回格式: ' + JSON.stringify(data).slice(0, 500);
}

async function callImageApi() {
  const c = getConfig();
  if (!c.imgKey && !c.imgUrl) {
    alert('请先在设置中配置图片生成API'); return;
  }
  if (!c.imgModel) { alert('请先在设置中选择图片生成模型'); return; }
  const prompt = document.getElementById('currentPrompt')?.value || document.getElementById('whiteBgPrompt')?.value || '';
  const resultArea = document.getElementById('resultArea');
  if (resultArea) resultArea.innerHTML = '<div class="loading"></div> <span style="color:var(--text2)">正在生成图片...</span>';

  const baseUrl = c.imgUrl.replace(/\/+$/, '');
  const endpoint = baseUrl.includes('/images') ? baseUrl : baseUrl + '/images/generations';

  try {
    const body = { model: c.imgModel, prompt, n: 1, size: '1024x1024' };
    if (state.uploadedImages.length > 0) body.image = state.uploadedImages[0];
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${c.imgKey}`, 'x-api-key': c.imgKey },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (data.data && data.data[0]) {
      const url = data.data[0].url || data.data[0].b64_json;
      if (resultArea) resultArea.innerHTML = `<div class="result-grid"><img src="${url.startsWith('http')?url:'data:image/png;base64,'+url}"></div>`;
    } else {
      if (resultArea) resultArea.innerHTML = `<p style="color:var(--warning)">返回数据：${JSON.stringify(data).slice(0,500)}</p>`;
    }
  } catch (err) {
    if (resultArea) resultArea.innerHTML = `<p style="color:var(--danger)">调用失败: ${err.message}</p>`;
  }
}

async function testApi() {
  const c = getConfig();
  const el = document.getElementById('testResult');
  if (!c.textKey) { el.innerHTML = '<span style="color:var(--warning)">请先填写文本API Key</span>'; return; }
  el.innerHTML = '<span class="loading"></span> 测试文本API连接...';
  const baseUrl = c.textUrl.replace(/\/+$/, '');
  const endpoint = baseUrl.includes('/chat/completions') ? baseUrl : baseUrl + '/chat/completions';
  try {
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${c.textKey}`, 'x-api-key': c.textKey },
      body: JSON.stringify({ model: c.textModel || 'gpt-4o', messages: [{ role:'user', content:'hi' }], max_tokens: 10 })
    });
    const data = await resp.json();
    if (data.choices || data.content) el.innerHTML = '<span style="color:var(--success)">文本API连接成功</span>';
    else el.innerHTML = `<span style="color:var(--warning)">返回: ${JSON.stringify(data).slice(0,200)}</span>`;
  } catch (err) {
    el.innerHTML = `<span style="color:var(--danger)">连接失败: ${err.message}</span>`;
  }
}

// Navigation
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    state.currentWorkflow = item.dataset.workflow;
    state.currentStep = 0;
    state.uploadedImages = [];
    state.productImages = [];
    state.recognitionResult = '';
    state.generatedPrompts = '';
    toggleDrawer(false);
    renderMain();
  });
});

function toggleDrawer(forceState) {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const isOpen = typeof forceState === 'boolean' ? !forceState : sidebar.classList.contains('open');
  sidebar.classList.toggle('open', !isOpen);
  overlay.classList.toggle('show', !isOpen);
}

// Init
renderMain();


</script>
